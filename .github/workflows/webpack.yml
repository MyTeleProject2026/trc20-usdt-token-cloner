name: NodeJS build and contract compile

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # The package manifest includes Undici 8.x, which requires Node.js >=22.19.0.
      # Keep CI aligned with the supported runtime instead of testing Node 20.
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security regression tests
        run: npm test

      - name: Compile contract and build frontend
        run: npm run build
