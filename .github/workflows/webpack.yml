name: NodeJS build and contract compile

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # The package manifest includes Undici 8.x, which requires Node.js >=22.19.0.
      # Keep CI aligned with the supported runtime instead of testing Node 20.
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security regression tests
        run: npm test

      - name: Compile contract and build frontend
        run: npm run build
