name: Tron Transfer production smoke check

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [ui/modern-crypto-dashboard-theme]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: tron-transfer-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check existing Tron Transfer frontend
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /dev/null --write-out '%{http_code}' https://tron-transfer.onrender.com/)"
          if [[ "$code" != "200" ]]; then
            echo "Tron Transfer frontend returned HTTP $code; expected 200." >&2
            exit 1
          fi
          echo "Existing Tron Transfer frontend is reachable (HTTP 200)."

      - name: Check existing Tron Transfer Resource API
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in {1..6}; do
            if response="$(curl --connect-timeout 10 --max-time 20 --silent --show-error --fail https://tron-transfer-resource-api.onrender.com/health)"; then
              break
            fi
            echo "Resource API not ready (attempt $attempt/6); retrying in 10 seconds."
            sleep 10
          done
          if [[ -z "$response" ]]; then
            echo "Existing Tron Transfer Resource API health endpoint did not become ready." >&2
            exit 1
          fi
          printf '%s' "$response" | node --input-type=module -e '
            let body = "";
            for await (const chunk of process.stdin) body += chunk;
            const data = JSON.parse(body);
            if (data.status !== "ok") throw new Error("Resource API health response is not ok");
            console.log("Existing Tron Transfer Resource API is healthy.");
          '
      - name: Verify production Retry-After and CORS response headers
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = 'https://tron-transfer-resource-api.onrender.com/api/observatory/render-metrics';
          const origin = 'https://tron-transfer.onrender.com';
          let limited = null;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const response = await fetch(endpoint, {
              headers: { accept: 'application/json', origin },
              signal: AbortSignal.timeout(20000),
            });
            await response.arrayBuffer();
            if (response.status === 429) {
              limited = response;
              break;
            }
            if (![200, 503].includes(response.status)) {
              throw new Error('Unexpected production observatory response: HTTP ' + response.status);
            }
          }
          if (!limited) throw new Error('Production rate-limit probe did not receive HTTP 429 within 12 read-only requests.');
          const retryAfter = limited.headers.get('retry-after');
          if (retryAfter !== '60') throw new Error('Production Retry-After header mismatch: ' + String(retryAfter));
          const exposed = limited.headers.get('access-control-expose-headers') || '';
          if (!/\\bretry-after\\b/i.test(exposed)) throw new Error('Production CORS response does not expose Retry-After.');
          console.log('Production API returned HTTP 429 with Retry-After: 60 and CORS exposed the header.');
          NODE
