name: CI

on:
  # One authoritative PR test/build workflow. Separate audit checks remain enabled.
  push:
    branches: [main]
  pull_request:
    branches: [main, "fix/**", "test/**", "feat/**"]
  workflow_dispatch:

# Supersede older runs for the same PR instead of exhausting hosted-runner capacity.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Keep test and build coverage on both supported Node majors while retaining
      # the isolated PostgreSQL integration service in each matrix job.
      matrix:
        node-version: [22.x, 24.x]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sponsor_test
      SPONSOR_PG_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sponsor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sponsor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run security, regression, and isolated PostgreSQL integration tests
        run: npm test
      - name: Build frontend and compile contract
        run: npm run build
