name: CI

on:
  # One authoritative PR test/build workflow. Separate audit checks remain enabled.
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main, "fix/**", "test/**", "feat/**"]
  workflow_dispatch:

# Supersede older runs for the same PR instead of exhausting hosted-runner capacity.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sponsor_test
      SPONSOR_PG_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sponsor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sponsor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies (critical/high advisories block release)
        id: dependency_audit
        shell: bash
        run: |
          npm audit --json > npm-audit-ci.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          let blocking = true
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit-ci.json', 'utf8'))
            const counts = report.metadata?.vulnerabilities
            if (counts && !report.error) {
              console.log(JSON.stringify(counts, null, 2))
              blocking = (counts.critical ?? 0) > 0 || (counts.high ?? 0) > 0
            } else {
              console.error('npm audit did not return a valid vulnerability report.')
            }
          } catch {
            console.error('npm audit report could not be parsed.')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'blocking=' + String(blocking) + '\n')
          if (blocking) console.error('Critical/high dependency findings remain a release blocker; continuing tests for diagnostic coverage.')
          NODE
      - name: Run security, regression, and isolated PostgreSQL integration tests
        run: npm test
      - name: Build frontend and compile contract
        run: npm run build
      - name: Enforce dependency release gate
        if: steps.dependency_audit.outputs.blocking == 'true'
        run: |
          echo "Critical/high dependency advisories block release. See the dependency-audit artifact."
          exit 1
