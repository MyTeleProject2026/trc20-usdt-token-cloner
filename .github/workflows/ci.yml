name: CI

on:
  # Run push validation on main. Feature branches are validated by their PR
  # workflow below, avoiding duplicate CI jobs for every PR commit.
  push:
    branches: [main]
  pull_request:
    branches: [main, "fix/**", "test/**", "feat/**"]
  workflow_dispatch:

# New commits supersede older in-flight tests for the same PR. Required checks
# still run for the current head; do not weaken test, build, or audit steps.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sponsor_test
      SPONSOR_PG_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sponsor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sponsor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run security, regression, and isolated PostgreSQL integration tests
        run: npm test
      - name: Build frontend and compile contract
        run: npm run build
