name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run security and regression tests
        run: npm test
      - name: Build frontend and compile contract
        run: npm run build
