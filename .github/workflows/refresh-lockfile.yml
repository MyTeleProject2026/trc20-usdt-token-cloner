name: Refresh npm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml
      - .github/workflows/verify.yml
      - .github/workflows/webpack.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-npm-lockfile
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply non-breaking npm audit remediations to the lockfile
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          audit_fix_exit=$?
          set -e
          if [ "$audit_fix_exit" -ne 0 ]; then
            echo "::warning::Some advisories need manual remediation. Keeping any compatible lockfile fixes for review."
          fi
          npm install --package-lock-only --ignore-scripts
      - name: Report remaining dependency advisories
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-after-fix.json
          audit_exit=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync('npm-audit-after-fix.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const summary = [
            '## Candidate lockfile audit',
            '',
            '- Critical: ' + (counts.critical ?? 0),
            '- High: ' + (counts.high ?? 0),
            '- Moderate: ' + (counts.moderate ?? 0),
            '- Low: ' + (counts.low ?? 0),
            '- Total: ' + (counts.total ?? 0),
            '',
            'The lockfile is a candidate only. Review the generated branch and its checks before merging.'
          ].join('\\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\\n')
          console.log(summary)
          NODE
          echo "npm audit exit code after compatible remediation: $audit_exit"
      - name: Upload post-remediation audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-after-fix
          path: npm-audit-after-fix.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish candidate branch for manual pull-request creation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/refresh-npm-lockfile
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to publish."
            {
              echo "## Candidate lockfile"
              echo
              echo "No dependency changes were generated."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: apply compatible npm security fixes"
          git push --force origin HEAD:refs/heads/automation/refresh-npm-lockfile
          {
            echo "## Candidate branch published"
            echo
            echo "GitHub Actions in this repository is not permitted to create pull requests. Review the branch and create the PR manually:"
            echo
            echo "https://github.com/MyTeleProject2026/trc20-usdt-token-cloner/compare/main...automation/refresh-npm-lockfile?expand=1"
            echo
            echo "Do not merge until CI, application verification, build checks, and the audit findings have been reviewed."
          } >> "$GITHUB_STEP_SUMMARY"
