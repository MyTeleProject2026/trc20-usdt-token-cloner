name: Hosted runner allocation smoke test

on:
  push:
    branches: ["feat/**"]
    paths:
      - ".github/workflows/runner-allocation-smoke.yml"
  pull_request:
    branches: [main, "fix/**", "test/**", "feat/**"]
    paths:
      - ".github/workflows/runner-allocation-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm a hosted runner was actually allocated
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_NAME:-}" ]]; then
            echo "RUNNER_NAME is empty; the job did not establish a runner environment." >&2
            exit 1
          fi
          printf 'Runner name: %s\n' "$RUNNER_NAME"
          printf 'Runner OS: %s\n' "${RUNNER_OS:-unknown}"
          echo "Hosted runner reached a workflow step successfully."
