name: Hosted runner and application CI diagnostic

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - ".github/workflows/runner-allocation-smoke.yml"
  pull_request:
    branches: [main, "fix/**", "test/**", "feat/**"]
    paths:
      - ".github/workflows/runner-allocation-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-and-app-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sponsor_test
      SPONSOR_PG_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sponsor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sponsor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Confirm hosted runner allocation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_NAME:-}"
          printf 'Runner name: %s\n' "$RUNNER_NAME"
          printf 'Runner OS: %s\n' "${RUNNER_OS:-unknown}"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests including PostgreSQL integration tests
        run: npm test
      - name: Build frontend and compile contract
        run: npm run build
