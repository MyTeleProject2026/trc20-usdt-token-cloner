name: Fireblocks read-only inventory sync and config export

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_sync:
        description: "Confirm that this run only reads Fireblocks and TRON inventory"
        required: true
        type: choice
        options:
          - RUN_READ_ONLY_SYNC

permissions:
  contents: read

concurrency:
  group: fireblocks-readonly-inventory
  cancel-in-progress: false

jobs:
  sync-and-export:
    name: Verify Fireblocks vault and export safe configuration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fireblocks-readonly-sync
    steps:
      - name: Require the explicit read-only confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm_read_only_sync }}
        run: |
          if [[ "$CONFIRMATION" != "RUN_READ_ONLY_SYNC" ]]; then
            echo "::error::The read-only confirmation was not supplied."
            exit 1
          fi

      - name: Check that the backend trigger secret is configured
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.FIREBLOCKS_SYNC_TRIGGER_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" || "${#SYNC_TOKEN}" -lt 32 ]]; then
            echo "::error::Configure FIREBLOCKS_SYNC_TRIGGER_TOKEN in the fireblocks-readonly-sync GitHub Environment and the same value in Render."
            exit 1
          fi

      - name: Request backend read-only verification
        shell: bash
        env:
          SYNC_TOKEN: ${{ secrets.FIREBLOCKS_SYNC_TRIGGER_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({
            workflowRunId: process.env.RUN_ID,
            workflowRunAttempt: Number(process.env.RUN_ATTEMPT),
            repository: process.env.REPOSITORY,
            branch: process.env.REF_NAME,
            commitSha: process.env.COMMIT_SHA
          }))')"
          status="$(curl --silent --show-error --output sync-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SYNC_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$body" \
            https://trc20-usdt-token-cloner-api.onrender.com/api/treasury/fireblocks/inventory-sync)"
          if [[ "$status" != "200" ]]; then
            echo "::error::Backend inventory sync returned HTTP $status. Response body will not be printed."
            exit 1
          fi
          node -e 'const r=require("./sync-response.json"); if(r.success!==true) process.exit(1);'

      - name: Create sanitized configuration bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fireblocks-inventory-export
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = JSON.parse(fs.readFileSync('sync-response.json', 'utf8'));
          const config = response.configuration ?? {};
          const safe = {
            format: 'tron-token-studio/fireblocks-inventory-config/v1',
            generatedAt: response.checkedAt ?? new Date().toISOString(),
            verificationStatus: response.verificationStatus ?? 'blocked',
            snapshotSaved: response.snapshotSaved === true,
            snapshotId: response.snapshotId ?? null,
            configuration: config,
            checks: response.checks ?? {},
            balancesBaseUnits: response.balances ?? {},
            reasons: Array.isArray(response.reasons) ? response.reasons : [],
            safety: {
              apiKeyIncluded: false,
              rsaPrivateKeyIncluded: false,
              databaseUrlIncluded: false,
              payoutFlagsEnabled: false
            }
          };
          fs.writeFileSync('fireblocks-inventory-export/fireblocks-verified-config.json',
            JSON.stringify(safe, null, 2) + '\n', { mode: 0o600 });
          const clean = (value) => typeof value === 'string' && !/[\r\n]/.test(value) ? value : '';
          const envLines = [
            '# Generated by the Fireblocks read-only inventory workflow.',
            '# API key, RSA private key, and DATABASE_URL are intentionally excluded.',
            '# Keep these payout flags false; this package does not authorize transfers.',
            \`FIREBLOCKS_API_BASE=${clean(config.apiBase)}\`,
            \`FIREBLOCKS_VAULT_ACCOUNT_ID=${clean(config.vaultAccountId)}\`,
            \`FIREBLOCKS_USDT_ASSET_ID=${clean(config.usdtAssetId)}\`,
            \`FIREBLOCKS_TRX_ASSET_ID=${clean(config.trxAssetId)}\`,
            \`TREASURY_ADDRESS=${clean(config.treasuryAddress)}\`,
            \`FIREBLOCKS_SECRET_KEY_PATH=${clean(config.secretKeyPath)}\`,
            'TREASURY_SIGNER_MODE=fireblocks',
            'TREASURY_WITHDRAWALS_ENABLED=false',
            'TREASURY_TRX_WITHDRAWALS_ENABLED=false',
            ''
          ];
          fs.writeFileSync('fireblocks-inventory-export/fireblocks.nonsecret.env',
            envLines.join('\n'), { mode: 0o600 });
          const readme = [
            '# Fireblocks inventory configuration export',
            '',
            \`Verification status: **${safe.verificationStatus}**\`,
            \`Snapshot saved to PostgreSQL: **${safe.snapshotSaved}**\`,
            '',
            'This is a sanitized, read-only configuration export. It contains verified non-secret identifiers and public treasury address data only.',
            'The Fireblocks API key, RSA API-user private key, database URL, JWTs, and wallet private keys are deliberately not included.',
            'Keep the API key and RSA file in the backend secret manager. Do not copy secrets into GitHub artifacts, APKs, desktop installers, or chat.',
            '',
            'A status of **blocked** means at least one verification or persistence check did not pass. Do not treat this package as production authorization.',
            'Both treasury payout feature flags are explicitly false. This workflow never creates, approves, signs, or submits transactions.',
            ''
          ].join('\n');
          fs.writeFileSync('fireblocks-inventory-export/README.md', readme);
          fs.writeFileSync('fireblocks-inventory-export/workflow-response-status.txt',
            \`${safe.verificationStatus}\n\`);
          NODE
          (cd fireblocks-inventory-export && zip -q -r ../fireblocks-inventory-config.zip .)

      - name: Upload the configuration bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fireblocks-inventory-config
          path: fireblocks-inventory-config.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish verification result
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('sync-response.json', 'utf8'));
          console.log('## Fireblocks inventory sync');
          console.log('');
          console.log(\`- Verification: **${r.verificationStatus ?? 'blocked'}**\`);
          console.log(\`- PostgreSQL snapshot saved: **${r.snapshotSaved === true}**\`);
          console.log(\`- Snapshot ID: ${r.snapshotId ?? 'not saved'}\`);
          console.log('');
          console.log('The artifact excludes API keys, RSA key material, database credentials, and signing data.');
          if (Array.isArray(r.reasons) && r.reasons.length) {
            console.log('');
            console.log('### Blockers');
            for (const reason of r.reasons) console.log(\`- ${String(reason).replace(/[^a-z0-9-]/g, '')}\`);
          }
          NODE
          result="$(node -p 'JSON.parse(require("fs").readFileSync("sync-response.json","utf8")).verificationStatus')"
          if [[ "$result" != "verified" ]]; then
            echo "::error::Inventory sync completed but is blocked. Review the uploaded diagnostic artifact."
            exit 1
          fi
