name: Verify application

on:
  # Kept for a manual diagnostic run; the authoritative CI workflow runs on pushes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency advisories
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const advisories = Object.entries(report.vulnerabilities ?? {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            range: v.range,
            fixAvailable: v.fixAvailable,
            via: (v.via ?? []).map((x) => typeof x === 'string' ? x : {
              title: x.title,
              url: x.url,
              range: x.range,
            }),
          }));
          console.log(JSON.stringify({ metadata: report.metadata?.vulnerabilities, advisories }, null, 2));
          NODE
      - name: Run automated tests
        run: npm test
      - name: Build frontend and contract artifacts
        run: npm run build
