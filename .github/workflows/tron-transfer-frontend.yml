name: Tron Transfer Frontend
on:
  push:
    branches: [main, ui/modern-crypto-dashboard-theme]
    paths:
      - 'Frontend-Tron-Transfer/**'
      - 'contracts/Restricted1TRAX.sol'
      - 'contracts/OneTraxReserveVault.sol'
      - 'tronbox-config.cjs'
      - 'server/routes/tron-transfer.mjs'
      - 'tests/tron-transfer-integration-source.test.mjs'
      - '.github/workflows/tron-transfer-frontend.yml'
  pull_request:
    paths:
      - 'Frontend-Tron-Transfer/**'
      - 'server/routes/tron-transfer.mjs'
      - 'tests/tron-transfer-integration-source.test.mjs'
      - '.github/workflows/tron-transfer-frontend.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --prefix Frontend-Tron-Transfer --no-audit --no-fund
      - run: node --test tests/tron-transfer-integration-source.test.mjs
      - run: npm test --prefix Frontend-Tron-Transfer
      - run: npm run build --prefix Frontend-Tron-Transfer
