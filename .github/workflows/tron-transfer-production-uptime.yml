name: Tron Transfer Production Uptime Probe

on:
  push:
    branches:
      - main
      - ui/modern-crypto-dashboard-theme
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tron-transfer-production-uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Probe live frontend and resource API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production endpoints
        id: probe
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const targets = [
            { name: 'owner-admin-frontend', url: 'https://tron-transfer.onrender.com/', expectJson: false },
            { name: 'resource-api-health', url: 'https://tron-transfer-resource-api.onrender.com/health', expectJson: true, expectedNetwork: 'TRON Mainnet' },
            { name: 'owner-mainnet-resource-readiness', url: 'https://tron-transfer-resource-api.onrender.com/v1/resources/TNj5wv4bC5bYTrYWBLPmcxUPRRdx9GRVwp', expectJson: true, expectedNetwork: 'TRON Mainnet' },
            { name: 'mainnet-rpc-providers', url: 'https://tron-transfer-resource-api.onrender.com/api/mainnet/provider-health', expectJson: true },
            { name: 'tronscan-explorer', url: 'https://tron-transfer-resource-api.onrender.com/api/mainnet/explorer-health', expectJson: true },
            { name: 'sponsor-readiness', url: 'https://tron-transfer-resource-api.onrender.com/api/sponsor/status', expectJson: true },
            { name: 'owner-signer-challenge-auth', url: 'https://tron-transfer-resource-api.onrender.com/api/wallet-auth/owner/signing-challenge', expectJson: true },
            { name: 'sponsor-signer-challenge-auth', url: 'https://tron-transfer-resource-api.onrender.com/api/wallet-auth/sponsor/signing-challenge', expectJson: true },
            { name: 'runtime-observatory', url: 'https://tron-transfer-resource-api.onrender.com/api/observatory/snapshot', expectJson: true },
            { name: 'uptime-history', url: 'https://tron-transfer-resource-api.onrender.com/api/observatory/uptime-history', expectJson: true },
            { name: 'render-metrics', url: 'https://tron-transfer-resource-api.onrender.com/api/observatory/render-metrics', expectJson: true },
          ];
          (async () => {
            // Probe targets concurrently so one sleeping Render service does
            // not consume the retry budget of the other endpoints.
            const results = await Promise.all(targets.map(async target => {
              const started = Date.now();
              try {
                let response;
                let body = '';
                let responseLatencyMs = 0;
                let attempts = 0;
                // Render free instances can need longer than a single request
                // timeout to wake. Retry transient gateway responses for up
                // to two minutes; measure the final response separately from
                // cold-start wait so a healthy warm response is not failed
                // solely because the instance had been sleeping.
                for (let attempt = 1; attempt <= 8; attempt += 1) {
                  const attemptStarted = Date.now();
                  response = await fetch(target.url, {
                    headers: { accept: 'application/json,text/html' },
                    signal: AbortSignal.timeout(20000),
                    redirect: 'follow',
                  });
                  body = await response.text();
                  responseLatencyMs = Date.now() - attemptStarted;
                  attempts = attempt;
                  if (![502, 503, 504].includes(response.status) || attempt === 8) break;
                  await new Promise(resolve => setTimeout(resolve, 15000));
                }
                let validPayload = true;
                let detail = 'HTTP ' + response.status;
                let metrics = null;
                let parsed = null;
                if (target.expectJson) {
                  try {
                    parsed = JSON.parse(body);
                    if (target.name === 'runtime-observatory' && parsed?.process && parsed?.requests && parsed?.heartbeat) {
                      metrics = {
                        sampledAt: parsed.sampledAt || null,
                        uptimeSeconds: Number(parsed.uptimeSeconds) || 0,
                        heartbeatSuccessPercent: Number(parsed.heartbeat.successPercent) || 0,
                        heartbeatMissedIntervals: Number(parsed.heartbeat.missedIntervals) || 0,
                        rssBytes: Number(parsed.process.rssBytes) || 0,
                        heapUsedBytes: Number(parsed.process.heapUsedBytes) || 0,
                        heapTotalBytes: Number(parsed.process.heapTotalBytes) || 0,
                        eventLoopP95Ms: Number(parsed.process.eventLoopP95Ms) || 0,
                        requestCount: Number(parsed.requests.count) || 0,
                        errors5xx: Number(parsed.requests.errors5xx) || 0,
                        errorRatePercent: Number(parsed.requests.errorRatePercent) || 0,
                        averageLatencyMs: Number(parsed.requests.averageLatencyMs) || 0,
                        p95LatencyMs: Number(parsed.requests.p95LatencyMs) || 0,
                      };
                    }
                    if (target.name === 'owner-signer-challenge-auth' || target.name === 'sponsor-signer-challenge-auth') {
                      validPayload = response.status === 401 && parsed?.success === false
                        && parsed?.error === 'WALLET_SESSION_REQUIRED';
                      const role = target.name.startsWith('owner-') ? 'Owner' : 'Sponsor';
                      detail = validPayload
                        ? role + ' sign-only challenge endpoint is present and rejects unauthenticated access'
                        : role + ' sign-only challenge endpoint did not enforce the expected wallet session';
                    } else if (target.name === 'sponsor-readiness') {
                      const flags = {
                        databaseConfigured: parsed?.databaseConfigured === true,
                        databaseReady: parsed?.databaseReady === true,
                        sponsorWritesPaused: parsed?.sponsorWritesPaused === true,
                        ledgerDurabilityVerified: parsed?.ledgerDurabilityVerified === true,
                        ownerAddressMatches: parsed?.ownerAddressMatches === true,
                        sponsorIndependent: parsed?.sponsorIndependent === true,
                        sponsorWalletEnrolled: parsed?.sponsorWalletEnrolled === true,
                        sessionAuthenticationConfigured: parsed?.sessionAuthenticationConfigured === true,
                        ownerAdminSessionConfigured: parsed?.ownerAdminSessionConfiguredForLedgerRelease === true,
                        localSignerReady: parsed?.localSignerReady === true,
                        engineEnabled: parsed?.engineEnabled === true,
                        broadcastAvailable: parsed?.broadcastAvailable === true,
                        clientSigningAvailable: parsed?.clientSigningAvailable === true,
                        writesReleaseConfigured: parsed?.writesReleaseConfigured === true,
                        writesReleaseAvailable: parsed?.writesReleaseAvailable === true,
                        stakingEnabled: parsed?.stakingPolicy?.enabled === true,
                        ownerTopupEnabled: parsed?.ownerTopupPolicy?.enabled === true,
                        transactionExecutionAvailable: parsed?.transactionExecutionAvailable === true,
                      };
                      const safetyFieldsPresent = [
                        'sponsorWritesPaused', 'engineEnabled', 'broadcastAvailable',
                        'clientSigningAvailable', 'writesReleaseConfigured',
                        'writesReleaseAvailable', 'transactionExecutionAvailable',
                      ].every(key => typeof parsed?.[key] === 'boolean')
                        && typeof parsed?.stakingPolicy?.enabled === 'boolean'
                        && typeof parsed?.ownerTopupPolicy?.enabled === 'boolean';
                      // This is an availability/schema probe, not a policy gate.
                      // Sponsor controls are operator-managed in the application:
                      // an intentionally enabled engine, signer, staking policy or
                      // broadcast path must not be treated as an outage. Readiness
                      // and release blockers remain visible in the acceptance state.
                      const acceptanceState = String(parsed?.acceptance?.state || 'unknown').slice(0, 40);
                      const acceptanceChecksPresent = parsed?.acceptance?.version === 1
                        && Array.isArray(parsed?.acceptance?.checks);
                      validPayload = response.ok && parsed?.success === true
                        && acceptanceChecksPresent && safetyFieldsPresent;
                      const databaseStatus = String(parsed?.databaseStatus || 'unknown').slice(0, 32);
                      metrics = {
                        databaseConfigured: flags.databaseConfigured,
                        databaseReady: flags.databaseReady,
                        ownerAddressMatches: flags.ownerAddressMatches,
                        sponsorIndependent: flags.sponsorIndependent,
                        sponsorWalletEnrolled: flags.sponsorWalletEnrolled,
                        sessionAuthenticationConfigured: flags.sessionAuthenticationConfigured,
                        ownerAdminSessionConfigured: flags.ownerAdminSessionConfigured,
                        ledgerDurabilityVerified: flags.ledgerDurabilityVerified,
                        sponsorWritesPaused: flags.sponsorWritesPaused,
                        localSignerReady: flags.localSignerReady,
                        engineEnabled: flags.engineEnabled,
                        broadcastAvailable: flags.broadcastAvailable,
                        clientSigningAvailable: flags.clientSigningAvailable,
                        writesReleaseConfigured: flags.writesReleaseConfigured,
                        writesReleaseAvailable: flags.writesReleaseAvailable,
                        stakingEnabled: flags.stakingEnabled,
                        ownerTopupEnabled: flags.ownerTopupEnabled,
                        transactionExecutionAvailable: flags.transactionExecutionAvailable,
                      };
                      detail = validPayload
                        ? 'Sponsor API schema valid · acceptance=' + acceptanceState
                          + ' · db=' + databaseStatus
                          + ' · dbReady=' + flags.databaseReady
                          + ' · sponsor=' + flags.sponsorWalletEnrolled
                          + ' · owner=' + flags.ownerAddressMatches
                          + ' · independent=' + flags.sponsorIndependent
                          + ' · durable=' + flags.ledgerDurabilityVerified
                          + ' · adminSession=' + flags.ownerAdminSessionConfigured
                          + ' · paused=' + flags.sponsorWritesPaused
                          + ' · signer=' + flags.localSignerReady
                          + ' · engine=' + flags.engineEnabled
                          + ' · broadcast=' + flags.broadcastAvailable
                          + ' · releaseConfigured=' + flags.writesReleaseConfigured
                          + ' · releaseReady=' + flags.writesReleaseAvailable
                          + ' · staking=' + flags.stakingEnabled
                          + ' · topup=' + flags.ownerTopupEnabled
                          + ' · execute=' + flags.transactionExecutionAvailable
                        : 'Sponsor status endpoint is unavailable or returned an invalid response schema';
                    } else if (target.name === 'owner-mainnet-resource-readiness') {
                      const energy = String(parsed?.energy?.available ?? '');
                      const freeBandwidth = String(parsed?.bandwidth?.freeAvailable ?? '');
                      const stakedBandwidth = String(parsed?.bandwidth?.stakedOrDelegatedAvailable ?? '');
                      const providers = parsed?.rpc?.providersUsed || {};
                      validPayload = response.ok && parsed?.network === 'TRON Mainnet'
                        && /^\d+$/.test(energy)
                        && /^\d+$/.test(freeBandwidth)
                        && /^\d+$/.test(stakedBandwidth)
                        && Boolean(providers.accountResources && providers.account && providers.chainParameters);
                      metrics = {
                        energyAvailable: energy,
                        freeBandwidthAvailable: freeBandwidth,
                        stakedBandwidthAvailable: stakedBandwidth,
                        accountResourcesProvider: String(providers.accountResources || 'unknown'),
                        accountProvider: String(providers.account || 'unknown'),
                        chainParametersProvider: String(providers.chainParameters || 'unknown'),
                      };
                      detail = validPayload
                        ? 'Energy=' + energy + ' · free Bandwidth=' + freeBandwidth
                          + ' · staked Bandwidth=' + stakedBandwidth
                          + ' · RPC=' + providers.accountResources + '/' + providers.account + '/' + providers.chainParameters
                        : 'Owner Mainnet resource snapshot unavailable or missing provider provenance';
                    } else if (target.name === 'mainnet-rpc-providers') {
                      const providers = Array.isArray(parsed?.providers) ? parsed.providers : [];
                      const tatum = providers.find(provider => provider?.id === 'tatum');
                      const trongrid = providers.find(provider => provider?.id === 'trongrid');
                      const bothReachable = parsed?.providerPriority?.[0] === 'tatum'
                        && parsed?.providerPriority?.includes('trongrid')
                        && tatum?.configured === true && tatum?.reachable === true
                        && trongrid?.configured === true && trongrid?.reachable === true;
                      validPayload = response.ok && parsed?.network === 'TRON Mainnet' && bothReachable;
                      detail = validPayload
                        ? 'Tatum block ' + tatum.blockNumber + ' · TronGrid block ' + trongrid.blockNumber
                        : 'Independent RPC check failed · Tatum=' + (tatum?.reachable ? 'reachable' : 'unavailable')
                          + ' · TronGrid=' + (trongrid?.reachable ? 'reachable' : 'unavailable');
                    } else if (target.name === 'tronscan-explorer') {
                      validPayload = response.ok && parsed?.ok === true
                        && parsed?.explorer === 'TronScan' && parsed?.network === 'TRON Mainnet'
                        && parsed?.reachable === true && parsed?.probeContractIndexed === true;
                      const apiKeyState = parsed?.apiKeyConfigured === true
                        ? String(parsed.apiKeySource || 'configured')
                        : 'not configured (public read-only)';
                      detail = validPayload
                        ? 'TronScan public read endpoint reachable · official USDT indexed · API key=' + apiKeyState
                        : !parsed?.reachable
                          ? 'TronScan Mainnet explorer unavailable · ' + String(parsed?.errorCode || 'unreachable')
                          : 'TronScan did not confirm the official USDT reference contract';
                    } else if (target.name === 'uptime-history') {
                      const count = Array.isArray(parsed?.runs) ? parsed.runs.length : 0;
                      validPayload = response.ok && parsed?.success === true && count > 0;
                      detail = validPayload ? 'Git-backed history served · ' + count + ' archived runs' : 'history endpoint returned no valid archived records';
                    } else if (target.name === 'render-metrics') {
                      const metrics = Array.isArray(parsed?.metrics) ? parsed.metrics : [];
                      const cpu = metrics.find(item => item.id === 'cpu');
                      const memory = metrics.find(item => item.id === 'memory');
                      const hasMetricRecords = Boolean(cpu && memory);
                      const unavailable = [cpu, memory].some(item => item?.state === 'unavailable');
                      const hasSamples = Boolean(cpu?.points?.length && memory?.points?.length);
                      validPayload = response.ok && parsed?.success === true
                        && parsed?.configured === true && hasMetricRecords && !unavailable;
                      detail = validPayload
                        ? hasSamples
                          ? 'server credential verified · CPU and memory samples received'
                          : 'server credential verified · CPU=' + String(cpu.state || 'unknown')
                            + ' · memory=' + String(memory.state || 'unknown')
                            + ' · no platform samples in the current window'
                        : parsed?.configured === false
                          ? 'RENDER_API_KEY is not configured on the resource API'
                          : !hasMetricRecords
                            ? 'Render metrics payload is missing CPU or memory metric records'
                            : 'Render CPU or memory metrics are unavailable from the platform API';
                    } else {
                      const networkMatches = !target.expectedNetwork || parsed?.network === target.expectedNetwork;
                      validPayload = response.ok && parsed && parsed.ok === true && networkMatches;
                      detail = validPayload
                        ? (target.expectedNetwork ? 'healthy · ' + target.expectedNetwork : 'valid JSON health payload')
                        : !networkMatches
                          ? 'unexpected network: ' + String(parsed?.network || 'missing')
                          : 'unexpected JSON health payload';
                    }
                  } catch {
                    validPayload = false;
                    detail = 'response was not valid JSON';
                  }
                } else {
                  validPayload = response.ok && body.length > 0;
                  detail = validPayload ? 'HTML response received' : 'empty or unsuccessful frontend response';
                }
                const elapsedMs = Date.now() - started;
                const expectedUnauthorized = (target.name === 'owner-signer-challenge-auth'
                  || target.name === 'sponsor-signer-challenge-auth')
                  && response.status === 401 && parsed?.success === false
                  && parsed?.error === 'WALLET_SESSION_REQUIRED';
                if (attempts > 1) detail += ' · recovered after ' + elapsedMs + ' ms (' + attempts + ' attempts)';
                if (responseLatencyMs > 5000) detail += ' · final response latency threshold exceeded';
                return {
                  name: target.name,
                  url: target.url,
                  ok: (response.ok || expectedUnauthorized) && validPayload && responseLatencyMs <= 5000,
                  status: response.status,
                  latencyMs: responseLatencyMs,
                  elapsedMs,
                  attempts,
                  detail,
                  metrics,
                  checkedAt: new Date().toISOString(),
                };
              } catch (error) {
                return {
                  name: target.name,
                  url: target.url,
                  ok: false,
                  status: 0,
                  latencyMs: Date.now() - started,
                  elapsedMs: Date.now() - started,
                  attempts: 0,
                  detail: String(error && error.message || error).slice(0, 240),
                  checkedAt: new Date().toISOString(),
                };
              }
            }));
            fs.mkdirSync('uptime-results', { recursive: true });
            fs.writeFileSync('uptime-results/latest.json', JSON.stringify({
              service: 'Tron Transfer',
              source: 'GitHub Actions scheduled production probe',
              interval: '5 minutes (best effort; GitHub scheduled execution is not real-time guaranteed)',
              results,
            }, null, 2) + '\n');
            const failed = results.filter(item => !item.ok);
            const summary = [
              '## Tron Transfer production probe',
              '',
              '| Target | Result | Latency | Details |',
              '|---|---:|---:|---|',
              ...results.map(item => `| ${item.name} | ${item.ok ? 'PASS' : 'FAIL'} (HTTP ${item.status}) | ${item.latencyMs} ms | ${item.detail.replaceAll('|', '/')} |`),
              '',
              `Checked at: ${new Date().toISOString()}`,
              '',
              'Probe results are retained as workflow artifacts for 90 days. Failed checks open or update one deduplicated GitHub incident; a fully healthy run closes it. This does not replace a permanent metrics database.',
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            if (failed.length) {
              console.error(failed.length + ' production endpoint probe(s) failed');
              process.exitCode = 1;
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Verify production Retry-After and CORS response headers
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = 'https://tron-transfer-resource-api.onrender.com/api/observatory/render-metrics';
          const origin = 'https://tron-transfer.onrender.com';
          let limited = null;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const response = await fetch(endpoint, {
              headers: { accept: 'application/json', origin },
              signal: AbortSignal.timeout(20000),
            });
            await response.arrayBuffer();
            if (response.status === 429) {
              limited = response;
              break;
            }
            if (![200, 503].includes(response.status)) {
              throw new Error('Unexpected production observatory response: HTTP ' + response.status);
            }
          }
          if (!limited) throw new Error('Production rate-limit probe did not receive HTTP 429 within 12 read-only requests.');
          const retryAfter = limited.headers.get('retry-after');
          if (retryAfter !== '60') throw new Error('Production Retry-After header mismatch: ' + String(retryAfter));
          const exposed = limited.headers.get('access-control-expose-headers') || '';
          if (!/\bretry-after\b/i.test(exposed)) throw new Error('Production CORS response does not expose Retry-After.');
          console.log('Production API returned HTTP 429 with Retry-After: 60 and CORS exposed the header.');
          NODE
      - name: Persist probe to Git-backed history
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const api = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
          const branch = 'monitoring-history';
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: 'Bearer ' + process.env.GH_TOKEN,
            'x-github-api-version': '2022-11-28',
            'content-type': 'application/json',
          };
          async function request(path, method = 'GET', body) {
            const response = await fetch(api + path, {
              method, headers, ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(15000),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok && response.status !== 404) {
              throw new Error('GitHub history API returned HTTP ' + response.status + ': ' + String(payload.message || '').slice(0, 160));
            }
            return { response, payload };
          }
          (async () => {
            if (!fs.existsSync('uptime-results/latest.json')) {
              console.log('No probe report was produced; history write skipped.');
              return;
            }
            const report = JSON.parse(fs.readFileSync('uptime-results/latest.json', 'utf8'));
            const checkedAt = report.results?.[0]?.checkedAt || new Date().toISOString();
            const date = new Date(checkedAt).toISOString().slice(0, 10);
            const path = '/contents/history/' + date + '.json?ref=' + encodeURIComponent(branch);
            const failed = (report.results || []).filter(item => !item.ok);
            const record = {
              id: Number(process.env.GITHUB_RUN_ID),
              runNumber: Number(process.env.GITHUB_RUN_NUMBER),
              checkedAt,
              status: failed.length ? 'failure' : 'success',
              conclusion: failed.length ? 'failure' : 'success',
              commit: process.env.GITHUB_SHA,
              event: process.env.GITHUB_EVENT_NAME,
              url: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
              results: (report.results || []).map(item => ({
                name: String(item.name || '').slice(0, 80),
                ok: item.ok === true,
                status: Number(item.status) || 0,
                latencyMs: Math.max(0, Number(item.latencyMs) || 0),
                detail: String(item.detail || '').replace(/[\r\n]/g, ' ').slice(0, 240),
                metrics: item.metrics && typeof item.metrics === 'object' ? item.metrics : null,
                checkedAt: item.checkedAt || checkedAt,
              })),
            };
            async function readCurrent() {
              const { response, payload } = await request(path);
              if (response.status === 404) return { sha: null, document: { schemaVersion: 1, date, records: [] } };
              const decoded = Buffer.from(String(payload.content || '').replace(/\n/g, ''), 'base64').toString('utf8');
              const document = JSON.parse(decoded);
              if (!Array.isArray(document.records)) throw new Error('Existing uptime history has an invalid records array');
              return { sha: payload.sha, document };
            }
            async function write(current) {
              const records = current.document.records.filter(item => Number(item.id) !== record.id);
              records.push(record);
              records.sort((a, b) => Date.parse(a.checkedAt) - Date.parse(b.checkedAt));
              const document = { schemaVersion: 1, date, source: 'Tron Transfer scheduled production probes', records };
              const body = {
                message: 'monitor: archive production uptime probe ' + date + ' #' + record.runNumber,
                branch,
                content: Buffer.from(JSON.stringify(document, null, 2) + '\n').toString('base64'),
              };
              if (current.sha) body.sha = current.sha;
              const { response, payload } = await request('/contents/history/' + date + '.json', 'PUT', body);
              if (!response.ok) throw new Error('Could not persist uptime history: HTTP ' + response.status);
              console.log('Persisted probe #' + record.runNumber + ' to ' + branch + '/history/' + date + '.json');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\\nPersistent history: ' + branch + '/history/' + date + '.json (Git-backed)\\n');
            }
            let current = await readCurrent();
            try {
              await write(current);
            } catch (error) {
              if (!String(error.message).includes('HTTP 409')) throw error;
              current = await readCurrent();
              await write(current);
            }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Open or resolve production incident
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const api = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY;
          const title = '[Production Monitor] Tron Transfer availability incident';
          const runUrl = 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: 'Bearer ' + process.env.GH_TOKEN,
            'x-github-api-version': '2022-11-28',
            'content-type': 'application/json',
          };
          async function request(path, method = 'GET', body) {
            const response = await fetch(api + path, {
              method, headers, ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(15000),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error('GitHub incident API returned HTTP ' + response.status);
            return payload;
          }
          (async () => {
            if (!fs.existsSync('uptime-results/latest.json')) return;
            const report = JSON.parse(fs.readFileSync('uptime-results/latest.json', 'utf8'));
            const failed = (report.results || []).filter(item => !item.ok);
            let issues;
            try {
              issues = await request('/issues?state=open&per_page=100');
            } catch (error) {
              // Repositories with Issues disabled return HTTP 410. Keep the
              // health probe and durable archive working without issue alerts.
              if (String(error.message).includes('HTTP 410')) {
                console.log('GitHub Issues are disabled for this repository; incident tracking skipped.');
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\\nIncident tracking skipped: GitHub Issues are disabled (HTTP 410).\\n');
                return;
              }
              throw error;
            }
            const incident = issues.find(item => !item.pull_request && item.title === title);
            const checkedAt = new Date().toISOString();
            if (failed.length) {
              const details = failed.map(item => '- **' + item.name + '** — HTTP ' + item.status + ', ' + item.latencyMs + ' ms: ' + String(item.detail).replace(/[\r\n]/g, ' ').slice(0, 240)).join('\n');
              const body = [
                '## Production availability incident',
                '',
                'At least one production endpoint failed its health, heartbeat, or latency check.',
                '',
                details,
                '',
                '**Latest check:** ' + checkedAt,
                '**Workflow run:** ' + runUrl,
                '**Commit:** ' + process.env.GITHUB_SHA,
                '',
                'This issue is automatically updated by the scheduled production probe and closed after a fully healthy check.',
              ].join('\n');
              if (incident) {
                await request('/issues/' + incident.number, 'PATCH', { body });
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nIncident issue updated: ' + incident.html_url + '\n');
              } else {
                const created = await request('/issues', 'POST', { title, body });
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nProduction incident opened: ' + created.html_url + '\n');
              }
            } else if (incident) {
              const body = String(incident.body || '') + '\n\n## Recovery\n\nAll monitored endpoints passed at ' + checkedAt + '. Recovery workflow: ' + runUrl;
              await request('/issues/' + incident.number, 'PATCH', { state: 'closed', body });
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nProduction incident resolved: ' + incident.html_url + '\n');
            } else {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nNo open production incident; all checks passed.\n');
            }
          })().catch(error => {
            // GitHub Issues can be disabled after the read succeeds; treat HTTP
            // 410 on create/update/resolve the same as HTTP 410 on the list call.
            if (String(error?.message || error).includes('HTTP 410')) {
              console.log('GitHub Issues are disabled for this repository; incident tracking skipped.');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nIncident tracking skipped: GitHub Issues are disabled (HTTP 410).\n');
              return;
            }
            console.error('Incident automation could not update GitHub issues:', error.message);
            process.exitCode = 1;
          });
          NODE
      - name: Retain probe result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tron-transfer-uptime-${{ github.run_id }}
          path: uptime-results/latest.json
          if-no-files-found: warn
          retention-days: 90
