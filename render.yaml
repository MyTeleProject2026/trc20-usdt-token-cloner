# Render Blueprint for the existing TRON Transfer Resource API.
# The application database is the existing Neon PostgreSQL database.
# DATABASE_URL remains a manually managed secret; this Blueprint must not create a Render database.
services:
  - type: web
    name: tron-transfer-resource-api
    runtime: node
    region: singapore
    repo: https://github.com/MyTeleProject2026/trc20-usdt-token-cloner
    branch: ui/modern-crypto-dashboard-theme
    buildCommand: cd Frontend-Tron-Transfer/resource-api && npm test && npm run check
    startCommand: cd Frontend-Tron-Transfer/resource-api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://tron-transfer.onrender.com
      - key: TATUM_API_KEY
        sync: false
      - key: TATUM_TRON_NETWORK
        value: mainnet
      - key: TATUM_TRON_RPC_URL
        value: https://tron-mainnet.gateway.tatum.io
      - key: TRONGRID_API_KEY
        sync: false
      - key: TRON_OWNER_ADDRESS
        sync: false
      - key: SPONSOR_MAINNET_ADDRESS
        sync: false
      - key: OWNER_ADMIN_EXPECTED_DATABASE_IDENTITY_SHA256
        sync: false
      - key: TRON_OWNER_ENROLLMENT_TOKEN
        sync: false
      - key: SPONSOR_SESSION_SECRET
        sync: false
      - key: SPONSOR_TRANSACTION_ENGINE_ENABLED
        sync: false
      - key: SPONSOR_MAINNET_BROADCAST_ENABLED
        sync: false
      - key: SPONSOR_WRITES_RELEASE_ENABLED
        sync: false
      - key: SPONSOR_LEDGER_DURABLE
        sync: false
      - key: SPONSOR_LEDGER_BACKUP_VERIFIED
        sync: false
      - key: SPONSOR_LEDGER_RESTORE_TESTED
        sync: false
      - key: OWNER_ADMIN_DATABASE_URL
        sync: false
      - key: OWNER_OPERATION_LEDGER_DURABLE
        sync: false
      - key: OWNER_OPERATION_LEDGER_BACKUP_VERIFIED
        sync: false
      - key: OWNER_OPERATION_LEDGER_RESTORE_TESTED
        sync: false
      - key: OWNER_OPERATION_EXECUTION_ENABLED
        sync: false
      - key: OWNER_OPERATION_MAINNET_ACK
        sync: false
      - key: OWNER_MAX_FEE_LIMIT_SUN
        sync: false
      - key: TRAX_CONTRACT_ADDRESS
        sync: false
      - key: TRAX_RUNTIME_BYTECODE_SHA256
        sync: false
      - key: TRAX_DEPLOYMENT_EXECUTION_ENABLED
        sync: false
      - key: TRAX_DEPLOYMENT_MAINNET_ACK
        sync: false
      - key: TRAX_DEPLOYMENT_LEDGER_DURABLE
        sync: false
      - key: TRAX_DEPLOYMENT_LEDGER_BACKUP_VERIFIED
        sync: false
      - key: TRAX_DEPLOYMENT_LEDGER_RESTORE_TESTED
        sync: false
      - key: TRAX_DEPLOYMENT_MAX_FEE_LIMIT_SUN
        sync: false
      - key: TRAX_DEPLOYMENT_ORIGIN_ENERGY_LIMIT
        sync: false
      - key: TRAX_ACCEPT_OWNERSHIP_FEE_LIMIT_SUN
        sync: false
      - key: TRAX_ACCEPT_OWNERSHIP_MAX_FEE_LIMIT_SUN
        sync: false
